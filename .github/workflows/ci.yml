name: "ATLAS Memory CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-doctor:
    name: "Linter & Doctor"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.0
          cache: false

      - name: Run Ruff Lint
        run: pixi run ruff check .

      - name: Run Loop Doctor
        run: pixi run doctor:ci

  tests-and-benchmarks:
    name: "Test Suite & Benchmarks (Python 3.14)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.70.0
          cache: false

      - name: Run Full Test Suite
        run: pixi run test

      - name: Run Subsystem & BEAM Benchmarks
        run: pixi run benchmark
