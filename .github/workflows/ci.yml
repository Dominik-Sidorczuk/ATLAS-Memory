name: "ATLAS Cognitive Memory CI"

on:
  push:
    branches: [ "main", "release/*" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.jpg"
      - "*.png"
      - "*.svg"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.jpg"
      - "*.png"
      - "*.svg"
  workflow_dispatch:
    inputs:
      full_diagnostic:
        description: "Run full diagnostic report"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Code Hygiene, Static Analysis & Import Integrity
  # ============================================================================
  lint-and-hygiene:
    name: "Code Hygiene & Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "latest"
          cache: true

      - name: Ruff Linter & Imports Check
        run: pixi run ruff check .

      - name: Python Bytecode AST Compile Gate
        run: python3 -m py_compile $(git ls-files "*.py")

      - name: Shell Scripts Syntax Gate
        run: find scripts/ -name "*.sh" -exec bash -n {} +

      - name: Top-Level Module Import Integrity
        run: pixi run python -c "import atlas_memory; print('ATLAS Initialized:', atlas_memory.__version__)"

  # ============================================================================
  # 2. Security, Secret Leak Audit & Adversarial Testing
  # ============================================================================
  security-and-secrets:
    name: "Security & Secret Leak Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full commit history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          extra_args: --only-verified

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "latest"
          cache: true

      - name: Run AST Adversarial Security Scanner
        run: pixi run pytest tests/unit/test_adversarial_ast_security.py -v --junitxml=junit-security.xml

      - name: Production Path & PII Leak Shield
        run: |
          echo "Scanning src/ for hardcoded user workstation paths..."
          if git grep -E "/home/[a-zA-Z0-9_.-]+" src/; then
            echo "❌ ERROR: Hardcoded /home/ user workstation path detected in src/!"
            exit 1
          fi
          echo "✅ Production path shield verified."

      - name: Upload Security Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-security
          path: junit-security.xml
          retention-days: 7

  # ============================================================================
  # 3. Governance, Health Invariants & Loop Doctor
  # ============================================================================
  governance-and-doctor:
    name: "Governance & Loop Doctor (100/100)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "latest"
          cache: true

      - name: Run Loop Doctor Certification (100/100 Gate)
        run: pixi run doctor:ci

      - name: Validate Empirical Baseline JSON Files (if present)
        run: |
          pixi run python -c "
          import json, glob
          baselines = glob.glob('docs/baselines/*.json')
          if baselines:
              for b in baselines:
                  with open(b, 'r', encoding='utf-8') as fp:
                      data = json.load(fp)
                      assert len(data) > 0, f'Empty baseline JSON: {b}'
              print(f'✅ All {len(baselines)} baseline JSON files valid.')
          else:
              print('ℹ️ No local baseline JSON files in public repository (public mode OK).')
          "

  # ============================================================================
  # 4. Core Semantic & Cognitive Test Suite
  # ============================================================================
  test-semantic-suite:
    name: "Semantic & Cognitive Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint-and-hygiene, security-and-secrets, governance-and-doctor]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: "latest"
          cache: true

      - name: Run Full Semantic Test Suite
        run: pixi run pytest tests/ -v --durations=15 --junitxml=junit-tests.xml

      - name: Upload Test Suite Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-tests
          path: junit-tests.xml
          retention-days: 7

  # ============================================================================
  # 5. Packaging, Build Distribution & Clean-Venv Smoke Test
  # ============================================================================
  package-build-and-smoke:
    name: "Packaging & Wheel Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-hygiene, security-and-secrets, governance-and-doctor]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (Distribution Build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: python -m pip install --upgrade pip build twine hatchling

      - name: Build Source Distribution & Binary Wheel
        run: python -m build

      - name: Twine Package & Metadata Validation
        run: twine check --strict dist/*

      - name: Isolated Virtualenv Smoke Test
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          python -c "import atlas_memory; print('✅ Wheel Smoke Test PASSED: atlas-memory v' + atlas_memory.__version__)"

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-memory-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # 6. CI Status Gate (Consolidated Merge Protection Barrier)
  # ============================================================================
  ci-status-gate:
    name: "CI Status Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-and-hygiene
      - security-and-secrets
      - governance-and-doctor
      - test-semantic-suite
      - package-build-and-smoke
    steps:
      - name: Evaluate Upstream Gates & Publish Step Summary
        run: |
          LINT="${{ needs.lint-and-hygiene.result }}"
          SEC="${{ needs.security-and-secrets.result }}"
          GOV="${{ needs.governance-and-doctor.result }}"
          TEST="${{ needs.test-semantic-suite.result }}"
          BUILD="${{ needs.package-build-and-smoke.result }}"

          echo "## 🛡️ ATLAS Cognitive Memory — CI Certification Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Subsystem Pipeline | Result | Verification Scope |" >> $GITHUB_STEP_SUMMARY
          echo "|---|:---:|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Hygiene & Static Analysis** | $([ "$LINT" == "success" ] && echo "✅ PASS" || echo "❌ FAIL") | Ruff clean · AST bytecode compilation · Shell scripts · Module imports |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security & Secret Leak Audit** | $([ "$SEC" == "success" ] && echo "✅ PASS" || echo "❌ FAIL") | TruffleHog scanner · AST adversarial tests · Production path shield |" >> $GITHUB_STEP_SUMMARY
          echo "| **Governance & Loop Doctor** | $([ "$GOV" == "success" ] && echo "✅ PASS" || echo "❌ FAIL") | Loop Doctor (100/100 L2+) · Empirical baseline JSON integrity |" >> $GITHUB_STEP_SUMMARY
          echo "| **Semantic & Cognitive Suite** | $([ "$TEST" == "success" ] && echo "✅ PASS" || echo "❌ FAIL") | Hermetic pytest suite (Golden Master 30/30, DBSF, HippoRAG 2, L0-L3) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Packaging & Wheel Integrity** | $([ "$BUILD" == "success" ] && echo "✅ PASS" || echo "❌ FAIL") | Hatchling build · Twine strict validation · Clean venv wheel smoke test |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$LINT" != "success" || "$SEC" != "success" || "$GOV" != "success" || "$TEST" != "success" || "$BUILD" != "success" ]]; then
            echo "❌ **One or more CI jobs failed. Release/Merge blocked.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "🎉 **All ATLAS Cognitive Memory CI gates PASSED. Repository certified for production.**" >> $GITHUB_STEP_SUMMARY
