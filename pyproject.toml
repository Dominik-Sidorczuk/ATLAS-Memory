[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-memory"
version = "3.0.0"
description = "ATLAS Memory — 4-Layer Memory Architecture (TTT + JEPA + Hybrid Knowledge + Sleep Consolidation) with CRDT Sync, SIMD Quantization, and Autonomous Skill Compilation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dominik Sidorczuk" }
]
keywords = ["memory", "crdt", "agent", "llm", "mlops", "skill-compiler"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Modele danych, stan i walidacja
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    
    # Warstwa Obliczeniowa & Zero-Copy RAM
    "numba>=0.59.0",             # Ultra-szybkie jądra JIT (AVX-512 / microsecond latency)
    "pyarrow>=15.0.0",           # Zero-Copy In-Memory Columnar Tables & Parquet I/O
    "numpy>=1.26.0",
    
    # Warstwa L2: Pamięć Hybrydowa, Wektory i Grafy
    "qdrant-client>=1.9.0",      # Baza wektorowa (obsługuje tryb embedded/on-disk)
    "fastembed>=0.3.0",          # Błyskawiczne lokalne embeddingi (ONNX Runtime)
    "kuzu>=0.4.0",               # Wbudowana, dyskowa baza grafowa (Cypher query language)
    "networkx>=3.2.0",           # Do analizy topologicznej podgrafów w pamięci
    "spacy>=3.8.0",              # W2 OpenIE / morfologia PL+EN (POS, lematyzacja, zależności, NER — zero-torch)
    "python-igraph>=1.0.0",      # W4 Natywny silnik C Personalized PageRank (HippoRAG 2)

    # Podstawa Pamięci & Hot-Path Storage Backend: Mnemosyne Core & Hermes Bridge
    "mnemosyne-memory>=4.0.0b4", # Mnemosyne core (BEAM: SQLite + sqlite-vec + FTS5)
    "mnemosyne-hermes>=0.7.4",   # Hermes MemoryProvider bridge (in-process hot-path)
]

[project.optional-dependencies]
hermes = [
    "mnemosyne-memory>=4.0.0b4",
    "mnemosyne-hermes>=0.7.4",
]
peft = [
    "peft>=0.10.0",              # Opcjonalne: Zarządzanie mikro-adapterami LoRA (Weight Baking)
]
benchmark = [
    "datasets>=2.18.0",          # Opcjonalne: Ewaluacja datasetów BEAM (HuggingFace)
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
all = [
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]



[project.scripts]
atlas-daemon = "atlas_memory.server.atlas_daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "benchmark: performance benchmarks",
]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "W293", "E402", "B027", "B017", "W291"]



# ==============================================================================
# Pixi Configuration (Conda-forge + PyPI binary isolation)
# ==============================================================================
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
test = "pytest tests/ -v"
benchmark = "pytest tests/benchmark/ -m benchmark -v"
doctor = "python scripts/loop_doctor.py"
"doctor:ci" = "python scripts/loop_doctor.py --public"
"doctor:fix" = "bash scripts/doctor_fix.sh"
audit = "python scripts/loop_doctor.py"
cost = "python scripts/loop_doctor.py --cost"
invariants = "python scripts/atlas_health_invariants.py"
dedup = "python scripts/atlas_dedup_kv.py --dry-run"
"backup:audit" = "python scripts/atlas_backup_audit.py"
cleanup = "python scripts/atlas_memory_cleanup.py"
profile = "python scripts/profile_hot_paths.py"
calibrate = "python scripts/build_retrieval_calibration.py"
"calibration:build" = "python scripts/build_retrieval_calibration.py"
"benchmark:beam" = "python scripts/run_beam_benchmark.py"
"benchmark:head2head" = "python scripts/run_head_to_head_benchmark.py"
"qdrant:rebuild" = "python scripts/rebuild_qdrant_68m.py"
"integration:omniroute" = "python scripts/integration_real_omniroute.py"
"memory-map" = "python scripts/atlas_memory_map_v3.py"
"memory-map:v3" = "python scripts/atlas_memory_map_v3.py"



[tool.pixi.dependencies]
python = ">=3.14"
pydantic = ">=2.6.0"
aiosqlite = ">=0.20.0"
numpy = ">=1.26.0"
pyarrow = ">=15.0.0"
numba = ">=0.59.0"
networkx = ">=3.2.0"
psutil = ">=5.9.0"
httpx = ">=0.27.0"
cryptography = ">=42.0.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.4.0"

[tool.pixi.pypi-dependencies]
atlas-memory = { path = ".", editable = true }
qdrant-client = ">=1.9.0"
fastembed = ">=0.3.0"
kuzu = ">=0.4.0"
peft = ">=0.10.0"
spacy = ">=3.8.0"
python-igraph = ">=1.0.0"
